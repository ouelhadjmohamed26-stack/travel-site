<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8876B"/>
      <stop offset="100%" stop-color="#D4694C"/>
    </linearGradient>
    <filter id="logoShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGrad)" filter="url(#logoShadow)"/>
  
  <!-- Decorative border ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
  
  <!-- Moroccan arch (stylized mountain) -->
  <path d="M 60 120 Q 100 60 140 120" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Left accent -->
  <path d="M 75 110 L 80 95" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Right accent -->
  <path d="M 125 110 L 120 95" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Center compass point -->
  <circle cx="100" cy="95" r="5" fill="#fff"/>
  <circle cx="100" cy="95" r="2.5" fill="#D4694C"/>
  
  <!-- Bottom decorative line (Moroccan tile pattern inspired) -->
  <line x1="65" y1="135" x2="135" y2="135" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="85" cy="135" r="2" fill="#fff"/>
  <circle cx="100" cy="135" r="2" fill="#fff"/>
  <circle cx="115" cy="135" r="2" fill="#fff"/>
</svg>